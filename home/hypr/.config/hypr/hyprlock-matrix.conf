# Matrix / terminal lockscreen - matches the SDDM theme TerminalStyleLogin
# (+ its MatrixRain / MatrixHud components): black, #00FF41, DejaVu Sans Mono.
#
# Idle:   matrix rain + HUD rings creeping round, clock inside, no username.
# Typing: the input-field (a 720 px black disk with a green rim, rounding = -1)
#         fades in ABOVE the HUD: the turning rings vanish under it and a wider,
#         still ring holds the clock + password '*'. hyprlock can only fade
#         widgets (no scale/rotate), so "widen + stop turning" is this cover trick.
#
# Rain + rings are pre-rendered frames (hyprlock-matrix/gen.py) swapped once per
# second (hyprlock's minimum) with a crossfade; re-run gen.py after changing its
# knobs (`gen.py hud` redoes only the rings, ~5 s).
# Kept out of hyprlock.conf on purpose: HyprlockWallpaperSelect.sh rewrites every
# `path =` line in hyprlock.conf, which would clobber the frame paths here.

$green = rgb(00FF41)
$font  = DejaVu Sans Mono
$dir   = $HOME/.config/hypr/hyprlock-matrix
$cy    = 30          # vertical centre of the HUD / ring (px above screen centre)
# hyprlock sizes placeholder/fail text at field height / 4 (= 180 px on a 720 px
# circle), so the field shows an invisible dot and the fail message is a label.
$none  = <span size='1'>.</span>

general {
    hide_cursor = true
    immediate_render = true
    fractional_scaling = 2
}

# hyprlock 0.9.7 ignores background:crossfade_time - the crossfade between rain
# frames runs on `fadeIn` (speed is an integer, in 100 ms; must end before the
# next 1 s reload or that frame is refused). The ring cover is `inputFieldFade`.
animations {
    enabled = true
    bezier = linearish, 0, 0, 1, 1
    animation = fadeIn, 1, 8, linearish
    animation = inputFieldFade, 1, 4, linearish
}

# ---- matrix rain (24 frames, 1/s, crossfaded: slow drift) ----
background {
    monitor =
    path = $dir/rain/00.png
    color = rgb(000000)
    blur_passes = 0
    reload_time = 1
    reload_cmd = $dir/next.sh rain
}

# ---- HUD rings, 620 px (72 frames, 1/s: rings creep 1-5 deg/s) ----
image {
    monitor =
    path = $dir/hud/00.png
    size = 620
    rounding = 0
    border_size = 0
    reload_time = 1
    reload_cmd = $dir/next.sh hud
    position = 0, $cy
    halign = center
    valign = center
    zindex = 0
}

# ---- typing ring: covers the HUD while there is input ----
input-field {
    monitor =
    size = 720, 720
    rounding = -1
    outline_thickness = 3
    outer_color = rgba(0, 255, 65, 0.7)
    inner_color = rgba(0, 0, 0, 0.94)
    font_color = $green
    font_family = $font
    check_color = rgba(0, 255, 65, 1.0)
    fail_color = rgb(FF3B3B)
    capslock_color = rgb(FFB000)
    placeholder_text = $none
    check_text = $none
    fail_text = $none
    dots_text_format = *
    dots_size = 0.04
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = true
    fade_timeout = 1500
    hide_input = false
    position = 0, $cy
    halign = center
    valign = center
    zindex = 1
}

# clock: above the password line, stays visible over the typing disk
label {
    monitor =
    text = cmd[update:10000] echo "<b>$(date +%H:%M)</b>"
    color = $green
    font_size = 44
    font_family = $font
    position = 0, 105
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = SYSTEM LOCKED
    color = rgba(0, 255, 65, 0.45)
    font_size = 11
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}

# fail message under the ring (empty unless the last attempt failed)
label {
    monitor =
    text = <span foreground='##FF3B3B'>$FAIL</span>
    color = $green
    font_size = 13
    font_family = $font
    position = 0, -365
    halign = center
    valign = center
    zindex = 2
}

# terminal banner, bottom-left (SDDM shows "<host> sddm")
label {
    monitor =
    text = cmd[update:0] echo "$(cat /etc/hostname) hyprlock · $LAYOUT"
    color = rgba(0, 255, 65, 0.6)
    font_size = 11
    font_family = $font
    position = 24, 20
    halign = left
    valign = bottom
    zindex = 2
}
