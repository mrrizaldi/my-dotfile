# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */
# Hyprlock config - adapted from ASHRREAL/config
# Colors: wallust dynamic (generated from current wallpaper)

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

$font = JetBrainsMono Nerd Font

# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================

general {
    hide_cursor = true
    fractional_scaling = 2
    immediate_render = true
}

# ==============================================================================
# BACKGROUND
# ==============================================================================

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.1
    color = $color0
}

# ==============================================================================
# PARTICLES
# ==============================================================================

label {
    monitor =
    text = ✦
    color = rgba(240, 206, 36, 0.4)
    font_size = 12
    font_family = $font
    position = -80, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = ✧
    color = rgba(239, 223, 111, 0.6)
    font_size = 8
    font_family = $font
    position = 120, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = ✨
    color = rgba(237, 229, 131, 0.5)
    font_size = 10
    font_family = $font
    position = -200, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = ⭐
    color = rgba(240, 206, 36, 0.4)
    font_size = 6
    font_family = $font
    position = 180, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = ◆
    color = rgba(184, 174, 168, 0.3)
    font_size = 14
    font_family = $font
    position = -150, 50
    halign = center
    valign = center
}

# ==============================================================================
# BORDERS
# ==============================================================================

label {
    monitor =
    text = ╭─────────────────────────────────────────╮
    color = rgba(240, 206, 36, 0.4)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = ╰─────────────────────────────────────────╯
    color = rgba(240, 206, 36, 0.4)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -280
    halign = center
    valign = center
}

# ==============================================================================
# TIME
# ==============================================================================

# Time glow effect
label {
    monitor =
    text = $TIME
    color = rgba(240, 206, 36, 0.3)
    font_size = 85
    font_family = $font
    position = 2, 152
    halign = center
    valign = center
}

# Time display
label {
    monitor =
    text = $TIME
    color = $color13
    font_size = 80
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(240, 206, 36, 0.6)
}

# ==============================================================================
# DATE
# ==============================================================================

label {
    monitor =
    text = cmd[update:3600000] date +"%-A, %-d %B %Y"
    color = $color7
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ==============================================================================
# WEATHER (auto-detect location via IP)
# ==============================================================================

label {
    monitor =
    text = cmd[update:600000] timeout 10s bash -c 'loc=$(curl -s --max-time 5 "https://ipapi.co/json" 2>/dev/null); lat=$(echo "$loc" | jq -r ".latitude // empty"); lon=$(echo "$loc" | jq -r ".longitude // empty"); tz=$(echo "$loc" | jq -r ".timezone // \"UTC\""); if [ -n "$lat" ] && [ -n "$lon" ]; then weather_data=$(curl -s --max-time 5 "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&current_weather=true&hourly=relative_humidity_2m,apparent_temperature&temperature_unit=celsius&wind_speed_unit=kmh&timezone=${tz/\//\%2F}&forecast_days=1"); temp=$(echo "$weather_data" | jq -r ".current_weather.temperature // empty" | cut -d. -f1); code=$(echo "$weather_data" | jq -r ".current_weather.weathercode // empty"); wind=$(echo "$weather_data" | jq -r ".current_weather.windspeed // empty" | cut -d. -f1); current_hour=$(date +%-H); humidity=$(echo "$weather_data" | jq -r ".hourly.relative_humidity_2m[$current_hour] // empty"); feels=$(echo "$weather_data" | jq -r ".hourly.apparent_temperature[$current_hour] // empty" | cut -d. -f1); if [ -n "$temp" ] && [ -n "$code" ]; then case "$code" in 0) icon="☀️";; 1|2|3) icon="🌤️";; 45|48) icon="🌫️";; 51|53|55|56|57) icon="🌦️";; 61|63|65|66|67) icon="🌧️";; 71|73|75|77) icon="❄️";; 80|81|82) icon="🌧️";; 85|86) icon="❄️";; 95|96|99) icon="⛈️";; *) icon="🌤️";; esac; echo "${icon} ${temp}°C"; [ -n "$feels" ] && [ "$feels" != "$temp" ] && echo "Feels ${feels}°C"; [ -n "$humidity" ] && echo "💧 ${humidity}%"; fi; else echo "🌤️ --°C"; fi'
    color = $color6
    font_size = 14
    font_family = $font
    position = 30, -35
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(237, 229, 131, 0.4)
}

# ==============================================================================
# SYSTEM STATUS
# ==============================================================================

# CPU Usage
label {
    monitor =
    text = cmd[update:2000] echo "CPU: $(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1}' | cut -d. -f1)%"
    color = $color13
    font_size = 12
    font_family = $font
    position = -30, -35
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(240, 206, 36, 0.3)
}

# RAM Usage
label {
    monitor =
    text = cmd[update:3000] free | grep Mem | awk '{printf "RAM: %.0f%%", $3/$2 * 100.0}'
    color = $color5
    font_size = 12
    font_family = $font
    position = -30, -55
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(239, 223, 111, 0.3)
}

# ==============================================================================
# DECORATIONS
# ==============================================================================

# Diamond top left
label {
    monitor =
    text = ◇
    color = rgba(240, 206, 36, 0.4)
    font_size = 30
    font_family = $font
    position = -200, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(240, 206, 36, 0.2)
}

# Triangle top right
label {
    monitor =
    text = △
    color = rgba(239, 223, 111, 0.5)
    font_size = 25
    font_family = $font
    position = 200, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(239, 223, 111, 0.2)
}

# Hexagon bottom left
label {
    monitor =
    text = ⬢
    color = rgba(237, 229, 131, 0.4)
    font_size = 35
    font_family = $font
    position = -200, -250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 7
    shadow_color = rgba(237, 229, 131, 0.2)
}

# Star bottom right
label {
    monitor =
    text = ✦
    color = rgba(240, 206, 36, 0.6)
    font_size = 28
    font_family = $font
    position = 200, -250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(240, 206, 36, 0.2)
}

# ==============================================================================
# AVATAR
# ==============================================================================

# Avatar glow (label shadow trick - behind the image)
label {
    monitor =
    text = ●
    color = rgba(240, 206, 36, 0)
    font_size = 2
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 6
    shadow_size = 35
    shadow_color = rgba(240, 206, 36, 0.3)
}

# Avatar outer ring
image {
    monitor =
    path = $HOME/Pictures/zenitsu-avatar.jpg
    size = 92
    rounding = -1
    border_size = 2
    border_color = rgba(240, 206, 36, 0.35)
    position = 0, -10
    halign = center
    valign = center
    reload_time = -1
}

# Avatar inner
image {
    monitor =
    path = $HOME/Pictures/zenitsu-avatar.jpg
    size = 80
    rounding = -1
    border_size = 3
    border_color = $color2
    position = 0, -10
    halign = center
    valign = center
    reload_time = -1
}

# ==============================================================================
# WELCOME MESSAGE
# ==============================================================================

label {
    monitor =
    text = Welcome back, $USER
    color = $color13
    font_size = 18
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.85)
}

# ==============================================================================
# INPUT FIELD
# ==============================================================================

input-field {
    monitor =
    size = 280, 45
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $color2
    inner_color = $color0
    font_color = $color15
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = 🔒 Password...
    hide_input = false
    check_color = $color10
    fail_color = $color9
    fail_text = Authentication Failed! ($ATTEMPTS)
    capslock_color = $color11
    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 10
    shadow_color = rgba(240, 206, 36, 0.4)
}

# ==============================================================================
# CORNER MARKS
# ==============================================================================

label {
    monitor =
    text = ╭─
    color = rgba(240, 206, 36, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 15, -15
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(240, 206, 36, 0.3)
}

label {
    monitor =
    text = ─╮
    color = rgba(240, 206, 36, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -15, -15
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(240, 206, 36, 0.3)
}

label {
    monitor =
    text = ╰─
    color = rgba(240, 206, 36, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 15, 15
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(240, 206, 36, 0.3)
}

label {
    monitor =
    text = ─╯
    color = rgba(240, 206, 36, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -15, 15
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(240, 206, 36, 0.3)
}

# ==============================================================================
# AMBIENT GLOW (shadow-based, bukan large char)
# ==============================================================================

# Center glow
label {
    monitor =
    text = ●
    color = rgba(240, 206, 36, 0)
    font_size = 2
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 15
    shadow_size = 250
    shadow_color = rgba(240, 206, 36, 0.025)
}

# Left glow
label {
    monitor =
    text = ●
    color = rgba(239, 223, 111, 0)
    font_size = 2
    font_family = $font
    position = -300, 0
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 180
    shadow_color = rgba(239, 223, 111, 0.02)
}

# Right glow
label {
    monitor =
    text = ●
    color = rgba(237, 229, 131, 0)
    font_size = 2
    font_family = $font
    position = 300, 0
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 180
    shadow_color = rgba(237, 229, 131, 0.02)
}

# ==============================================================================
# MUSIC WIDGET (bottom-center, hanya muncul saat ada musik aktif)
# ==============================================================================

# Album art - centered, paling atas dari widget
image {
    monitor =
    path =
    size = 48
    rounding = 8
    border_size = 2
    border_color = $color2
    position = 0, 158
    halign = center
    valign = bottom
    reload_time = 2
    reload_cmd = $HOME/.config/hypr/UserScripts/playerctlock.sh --arturl
}

# Track title
label {
    monitor =
    text = cmd[update:1000] $HOME/.config/hypr/UserScripts/playerctlock.sh --title
    color = $color13
    font_size = 13
    font_family = $font
    position = 0, 118
    halign = center
    valign = bottom
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Artist name
label {
    monitor =
    text = cmd[update:1000] $HOME/.config/hypr/UserScripts/playerctlock.sh --artist
    color = $color7
    font_size = 11
    font_family = $font
    position = 0, 100
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Status + Source
label {
    monitor =
    text = cmd[update:1000] bash -c 's=$($HOME/.config/hypr/UserScripts/playerctlock.sh --status); src=$($HOME/.config/hypr/UserScripts/playerctlock.sh --source); [ -n "$s" ] && [ -n "$src" ] && echo "$s  -  $src" || echo "$s$src"'
    color = $color6
    font_size = 10
    font_family = $font
    position = 0, 83
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ==============================================================================
# BOTTOM BAR
# ==============================================================================

# Uptime - bottom left
label {
    monitor =
    text = cmd[update:60000] uptime -p | sed 's/up /⏱️ /'
    color = $color10
    font_size = 12
    font_family = $font
    position = 30, 35
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(240, 206, 36, 0.4)
}

# Network status - bottom right
label {
    monitor =
    text = cmd[update:5000] timeout 1s bash -c 'if ping -c 1 -W 1 8.8.8.8 &>/dev/null; then echo "● Connected"; else echo "○ Offline"; fi'
    color = $color6
    font_size = 12
    font_family = $font
    position = -30, 35
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(237, 229, 131, 0.4)
}

# Battery - bottom right (above network)
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color13
    font_size = 12
    font_family = $font
    position = -30, 55
    halign = right
    valign = bottom
}
