# Hypridle 
# Original config submitted by https://github.com/SherLock707                                                       
                                                      
$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # Quickshell Matrix lockscreen (~/.config/quickshell/matrix-lock); the script falls back to hyprlock.
    # Previous value: pidof hyprlock || hyprlock
    lock_cmd = /home/mrrizaldi/.config/hypr/UserScripts/matrix-lock.sh
    # unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session &   # lock the session without blocking suspend
    # dpms on, then lock-watchdog.sh: if the Quickshell lock stopped drawing after
    # resume (froze / lost its surface), hand the lock to hyprlock instead of trapping you.
    after_sleep_cmd = hyprctl dispatch hl.dsp.dpms '{ action = "on" }'; /home/mrrizaldi/.config/hypr/UserScripts/lock-watchdog.sh & /home/mrrizaldi/.config/hypr/UserScripts/livewall-resume.sh &
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

# turn off screen faster if session is already locked
# (disabled by default)
# listener {
#     timeout = 30                            # 30 seconds
#     on-timeout = pidof hyprlock && hyprctl dispatch hl.dsp.dpms '{ action = "off" }' # turns off the screen if hyprlock is active
#     on-resume = pidof hyprlock && hyprctl dispatch hl.dsp.dpms '{ action = "on" }'    # command to run when activity is detected after timeout has fired.
# }

# Warn
listener {
    timeout = 540                     # 9 min
    on-timeout = notify-send -i $iDIR " You are idle!" # command to run when timeout has passed
    on-resume = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"  # command to run when activity is detected after timeout has fired.
}

# Screenlock
listener {
    timeout = 600                     # 10 min
    on-timeout = loginctl lock-session # command to run when timeout has passed
    #on-resume = notify-send -i $iDIR " System Unlocked!"  # command to run when activity is detected after timeout has fired.
}

# Turn off screen 
# (disabled by default)
# listener {
#     timeout = 630                            # 10.5 min
#     on-timeout = hyprctl dispatch hl.dsp.dpms '{ action = "off" }'  # command to run when timeout has passed
#     on-resume = hyprctl dispatch hl.dsp.dpms '{ action = "on" }'    # command to run when activity is detected after timeout has fired.
# }

# Suspend after ~10 min on the lock screen (like closing the lid). Only when locked:
# idle-suspend.sh checks how long the lock has been up (needs >= 540 s).
#  - manual lock: idle starts at the lock -> the 600 s listener suspends
#  - auto-lock at 600 s: lock is brand new then (skipped) -> the 1200 s one suspends
listener {
    timeout = 600                     # 10 min
    on-timeout = /home/mrrizaldi/.config/hypr/UserScripts/idle-suspend.sh 540
}
listener {
    timeout = 1200                    # 20 min
    on-timeout = /home/mrrizaldi/.config/hypr/UserScripts/idle-suspend.sh 540
}
